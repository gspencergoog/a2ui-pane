<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2UI Pane</title>
    <!-- Preload script for host window.sidecar environment -->
    <script src="./preload.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--a2ui-color-surface, var(--background, #ffffff));
        color: var(--a2ui-text-color-text, var(--foreground, #24292f));
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
    <script>
      window.addEventListener(
        'error',
        function (e) {
          if (e.target && e.target.tagName === 'SCRIPT' && !window.__a2ui_retried__) {
            window.__a2ui_retried__ = true;
            var app = document.getElementById('app');
            if (app && !app.hasChildNodes()) {
              app.innerHTML =
                '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#6a737d;font-size:12px;font-family:sans-serif;">Connecting to sidecar...</div>';
              setTimeout(function () {
                window.location.reload();
              }, 1500);
            }
          }
        },
        true,
      );
    </script>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
